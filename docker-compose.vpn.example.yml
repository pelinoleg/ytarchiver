# ─────────────────────────────────────────────────────────────────────────────
# Folder-driven WireGuard exit pool for yt-dlp.
#
# Drop WireGuard *.conf files into a folder; the backend brings up one gluetun
# tunnel per file (via the Docker socket), routes yt-dlp through the HEALTHY
# ones, and rotates on a YouTube block. No working configs → direct download.
# Stale/broken configs never go healthy, so they're simply ignored.
#
# It's all opt-in via three things on the EXISTING backend service — no extra
# services to declare here (the tunnels are created at runtime as wgvpn-*):
#
#   backend:
#     environment:
#       WIREGUARD_CONFIGS_DIR: /wireguard
#       VPN_DOCKER_NETWORK: ytarchiver_ytarchiver_net   # the compose network name
#     volumes:
#       - /var/run/docker.sock:/var/run/docker.sock     # to spawn the tunnels
#       - /mnt/storage/media/YT-Archiver/wireguard:/wireguard   # the configs folder
#
# Usage
#   1. mkdir the host folder, drop your *.conf WireGuard files in.
#   2. Redeploy the backend once (to mount the socket + folder + env).
#   3. That's it — add/remove configs in the folder anytime; the supervisor
#      reconciles every few minutes. Watch it pick them up:
#        docker logs ytarchiver-backend 2>&1 | grep vpn:
#        docker ps --filter name=wgvpn-          # the live tunnels
#
# Notes
#   • Each tunnel needs ~30s after creation to pass gluetun's healthcheck before
#     it's added to the rotation. A dead/stale config stays unhealthy and unused.
#   • Proxied downloads use the VPN's bandwidth — prefer fast servers.
#   • Verify a tunnel's country once it's up:
#        docker exec ytarchiver-backend sh -c \
#          'https_proxy=http://<wgvpn-name>:8888 curl -s https://ipinfo.io/country'
#   • Manual override / non-folder proxies still work via YTDLP_PROXIES
#     (comma-separated proxy URLs); the folder tunnels are merged on top.
# ─────────────────────────────────────────────────────────────────────────────
